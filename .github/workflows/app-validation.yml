name: App validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: app-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Regression tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        env:
          VITE_AUTH_ENABLED: "true"
        run: npm run build
      - name: Build browser test preview
        env:
          VITE_AUTH_ENABLED: "false"
        run: npm run build
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Start production preview
        env:
          VITE_AUTH_ENABLED: "false"
        run: npm run preview:restart
      - name: Desktop and mobile flows
        run: node scripts/invest-browser-check.mjs
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: |
            artifacts/browser
            .grok/preview.log
          if-no-files-found: ignore
