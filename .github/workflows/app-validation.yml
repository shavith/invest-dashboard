name: App validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: app-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_AUTH_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Repair lockfile for validation
        run: |
          npm install --package-lock-only --ignore-scripts
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          import { execFileSync } from "node:child_process";
          const before = JSON.parse(execFileSync("git", ["show", "HEAD:package-lock.json"], { encoding: "utf8" }));
          const after = JSON.parse(readFileSync("package-lock.json", "utf8"));
          const packages = {};
          for (const key of new Set([...Object.keys(before.packages), ...Object.keys(after.packages)])) {
            if (JSON.stringify(before.packages[key]) !== JSON.stringify(after.packages[key])) packages[key] = after.packages[key] ?? null;
          }
          console.log("LOCKFILE_DELTA=" + JSON.stringify({ packages }));
          NODE
      - run: npm ci
      - name: Regression tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Start production preview
        run: npm run preview:restart
      - name: Desktop and mobile flows
        run: node scripts/invest-browser-check.mjs
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: |
            artifacts/browser
            .grok/preview.log
          if-no-files-found: ignore
